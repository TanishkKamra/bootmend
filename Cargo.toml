[package]
name = "bootmend"
version = "0.1.0"
edition = "2021"
description = "Windows PC audit app: hardware, health, security, software, and what to fix"
authors = ["Tanishk Kamra"]
license = "GPL-3.0-or-later"
repository = "https://github.com/TanishkKamra/bootmend"
publish = false

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts", "accesskit"] }
egui_extras = "0.36.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
regex = "1"
png = "0.17"
tiny-skia = "0.11.4"
raw-window-handle = "0.6"
rfd = "0.15"
sysinfo = { version = "0.35", default-features = false, features = ["system"] }
minisign-verify = "0.3"

[dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_NetworkManagement_Dns",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Ioctl",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[dev-dependencies]
minisign = "0.10"
