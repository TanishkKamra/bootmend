name: Release

# Pushing a version tag such as v0.1.1 tests, builds and signs bootmend.exe and opens a draft
# release with it. Installed copies only see a release once the draft is published by hand.
# Running the workflow by hand does everything except the release, as a rehearsal, and keeps the
# signed files as a workflow artifact for a week.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.99.1
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustup default 1.99.1

      - name: Read the version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
        run: |
          $v = (cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json).packages[0].version
          if ($LASTEXITCODE -or -not $v) { throw "Couldn't read the version from Cargo.toml." }
          if ($env:EVENT -eq 'push' -and $env:TAG -ne "v$v") { throw "The tag $env:TAG doesn't match version $v in Cargo.toml." }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Build the signer
        run: cargo build --release --locked --example sign_release

      # The only step that sees the key, and it runs nothing but the signer built above. The
      # signer refuses a key that doesn't match PUBLIC_KEY in src/update.rs.
      - name: Sign
        env:
          BOOTMEND_SIGNING_KEY: ${{ secrets.BOOTMEND_SIGNING_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: target/release/examples/sign_release.exe sign target/release/bootmend.exe $env:VERSION

      - name: Checksum
        id: sum
        run: |
          $h = (Get-FileHash target/release/bootmend.exe -Algorithm SHA256).Hash.ToLower()
          "sha256=$h" >> $env:GITHUB_OUTPUT
          "SHA-256 of bootmend.exe: ``$h``" >> $env:GITHUB_STEP_SUMMARY

      - name: Keep the signed files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bootmend-${{ steps.version.outputs.version }}
          path: |
            target/release/bootmend.exe
            target/release/bootmend.exe.minisig
          retention-days: 7
          if-no-files-found: error

      - name: Draft the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.sum.outputs.sha256 }}
        run: >-
          gh release create $env:TAG --draft --verify-tag --title "Bootmend $env:VERSION"
          --notes "SHA-256 of bootmend.exe: $env:SHA256"
          target/release/bootmend.exe target/release/bootmend.exe.minisig THIRD-PARTY-NOTICES.txt
